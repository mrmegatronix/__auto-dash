# go2rtc configuration for __auto-dash Security 8-Channel NVR / Cameras
# NVR IP: 192.168.1.250

streams:
  ch01:
    - rtsp://admin:781869a@192.168.1.250/ch01/01
  ch02:
    - rtsp://admin:781869a@192.168.1.250/ch02/01
  ch03:
    - rtsp://admin:781869a@192.168.1.250/ch03/01
  ch04:
    - rtsp://admin:781869a@192.168.1.250/ch04/01
  ch05:
    - rtsp://admin:781869a@192.168.1.250/ch05/01
  ch06:
    - rtsp://admin:781869a@192.168.1.250/ch06/01
  ch07:
    - rtsp://admin:781869a@192.168.1.250/ch07/01
  ch08:
    - rtsp://admin:781869a@192.168.1.250/ch08/01

api:
  listen: ":1984" # HTTP WebRTC / MSE / HLS / WebSocket API

webrtc:
  listen: ":8555" # WebRTC UDP / TCP
  candidates:
    - "127.0.0.1"
    - "192.168.1.250"

log:
  level: "info"
