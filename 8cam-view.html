  <script>
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadEnv() {
      try {
        const res = await fetch('.env');
        if (res.ok) {
          const text = await res.text();
          const lines = text.split('\n');
          lines.forEach(line => {
            const parts = line.split('=');
            if (parts.length === 2) {
              const key = parts[0].trim();
              const val = parts[1].trim();
              if (key === 'RTSP_PASSWORD') {
                localStorage.setItem('dash_rtsp_pwd', val);
              }
            }
          });
        }
      } catch (e) {
        console.warn("Could not load .env file", e);
      }
    }

    function setRtspPassword() {
      const current = localStorage.getItem('dash_rtsp_pwd') || '781869a';
      const pwd = prompt("Enter RTSP Camera Password:", current);
      if (pwd !== null) {
        localStorage.setItem('dash_rtsp_pwd', pwd);
        initCameras();
      }
    }

    async function initCameras() {
      await loadEnv();
      const rtspPwd = localStorage.getItem('dash_rtsp_pwd') || '781869a';
      document.querySelectorAll('.cam-item .mini-cam-feed').forEach((feed, i) => {
        const ch = (i + 1).toString().padStart(2, '0');
        const url = `rtsp://admin:${rtspPwd}@192.168.1.250/ch05/${ch}`;
        feed.setAttribute('data-rtsp', url);
        const link = feed.querySelector('.cam-launch-link');
        if (link) link.href = url;
      });
    }
    
    initCameras();
  </script>
